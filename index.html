<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><meta name="description" content="AMO Express — gestão de entregas e fretes"><title>AMO Express — Entregas simplificadas</title><link rel="stylesheet" href="styles.css?v=5.1.3"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"></head><body><div class="app-shell"><header class="topbar"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" width="27" height="27" fill="none"><path d="M8 29h19l5-11H19" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="m22 8-8 14h9l-4 17 17-22h-9l6-9" fill="white" opacity=".97"/></svg></div><div class="brand-name"><strong>AMO <span>Express</span></strong><small id="context-label">Sua entrega, sem complicação.</small></div><div class="header-right"><span id="sync" class="connection" title="Status da sincronização"><span class="status-dot"></span><span id="sync-text">Conectar</span></span><button id="logout" class="icon-button hidden" aria-label="Sair" title="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div></header><main id="app" class="main-content" aria-live="polite"><div class="busy">Preparando o AMO Express...</div></main><nav id="nav" class="bottom-nav hidden" aria-label="Navegação principal"></nav><div id="toast" class="toast hidden" role="status"></div><div id="modal" class="modal-layer hidden" role="presentation"></div></div><script>
window.AMO_BOOT_READY=false;
setTimeout(function(){
  if(window.AMO_BOOT_READY)return;
  var target=document.getElementById('app');
  if(!target)return;
  target.innerHTML='<div class="empty"><div class="empty-illustration">⚠️</div><strong>O AMO Express demorou para iniciar</strong><p>Uma versão antiga em cache ou a conexão com o Supabase pode estar impedindo o carregamento.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn" id="amo-retry">Tentar novamente</button><button class="btn subtle" id="amo-fix-cache">Atualizar arquivos do app</button></div></div>';
  document.getElementById('amo-retry').onclick=function(){location.reload()};
  document.getElementById('amo-fix-cache').onclick=async function(){
    this.disabled=true;this.textContent='Atualizando…';
    try{
      if('serviceWorker' in navigator){var registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>r.scope.startsWith(location.origin+location.pathname.replace(/[^/]*$/,''))).map(r=>r.unregister()));}
      if('caches' in window){var keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('amo-express-shell-')).map(k=>caches.delete(k)));}
    }catch(e){console.warn('Falha ao limpar cache do aplicativo',e)}
    // Não apagar localStorage, sessão Supabase ou fila de atualizações offline.
    location.replace(location.pathname+'?atualizacao='+Date.now()+location.hash);
  };
},18000);
</script><script src="config.js?v=5.1.3"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script async src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/lib/browser.min.js"></script><script src="app.js?v=5.1.3"></script></body></html>
